services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-3001}:3001"
    environment:
      PORT: "${PORT:-3001}"
      CORS_ORIGIN: "${CORS_ORIGIN:-http://localhost:3000}"
      WORKSPACE_ROOT: /workspaces
      PHP_IMAGE: "${PHP_IMAGE:-php:8.2-cli-alpine}"
      EXEC_TIMEOUT_MS: "${EXEC_TIMEOUT_MS:-5000}"
      CONTAINER_MEMORY: "${CONTAINER_MEMORY:-64m}"
      CONTAINER_CPUS: "${CONTAINER_CPUS:-0.5}"
      CONTAINER_PIDS: "${CONTAINER_PIDS:-32}"
      MAX_FILE_SIZE_BYTES: "${MAX_FILE_SIZE_BYTES:-524288}"
      MAX_WORKSPACE_SIZE_BYTES: "${MAX_WORKSPACE_SIZE_BYTES:-5242880}"
      RATE_LIMIT_MAX: "${RATE_LIMIT_MAX:-60}"
      RUN_RATE_LIMIT_MAX: "${RUN_RATE_LIMIT_MAX:-10}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    volumes:
      # Workspace persistence
      - workspaces:/workspaces
      # Give the container access to the host Docker socket so it can
      # spawn sibling PHP containers (Docker-out-of-Docker pattern)
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  workspaces:
    driver: local
