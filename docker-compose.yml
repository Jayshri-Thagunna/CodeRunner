services:

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Pre-pull the PHP image so the first /api/run doesn't time out waiting for it
  php-pull:
    image: php:8.2-cli-alpine
    command: ["php", "--version"]
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      php-pull:
        condition: service_completed_successfully
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
      CORS_ORIGIN: "http://localhost:3000"
      WORKSPACE_ROOT: /workspaces
      WORKSPACE_VOLUME: coderunner_workspaces
      PHP_IMAGE: "${PHP_IMAGE:-php:8.2-cli-alpine}"
      EXEC_TIMEOUT_MS: "${EXEC_TIMEOUT_MS:-5000}"
      CONTAINER_MEMORY: "${CONTAINER_MEMORY:-64m}"
      CONTAINER_CPUS: "${CONTAINER_CPUS:-0.5}"
      CONTAINER_PIDS: "${CONTAINER_PIDS:-32}"
      MAX_FILE_SIZE_BYTES: "${MAX_FILE_SIZE_BYTES:-524288}"
      MAX_WORKSPACE_SIZE_BYTES: "${MAX_WORKSPACE_SIZE_BYTES:-5242880}"
      RATE_LIMIT_MAX: "${RATE_LIMIT_MAX:-60}"
      RUN_RATE_LIMIT_MAX: "${RUN_RATE_LIMIT_MAX:-10}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    volumes:
      - workspaces:/workspaces
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  workspaces:
    driver: local
